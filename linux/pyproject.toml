[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keyflow"
version = "1.0.0"
description = "System-wide text expander for Linux (port of KeyFlowMac)"
requires-python = ">=3.10"
dependencies = ["evdev"]

[project.scripts]
keyflow = "keyflow.cli:main"

[tool.setuptools]
packages = ["keyflow"]
